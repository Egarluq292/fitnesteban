<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FITNESTEBAN</title>
  <meta name="description" content="Entreno, nutrición y coach de progresión de Esteban" />
  <meta name="theme-color" content="#05080a" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-48.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fitnesteban" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-ink text-white antialiased">

  <header class="sticky top-0 z-30 bg-ink/90 backdrop-blur border-b border-line pt-safe">
    <div class="max-w-xl mx-auto flex items-center justify-between px-4 h-14">
      <button id="homeBtn" type="button" class="flex items-center gap-2.5 min-w-0 text-left rounded-xl active:opacity-70" aria-label="Ir al inicio: dieta de hoy">
        <img src="icons/logo-128.png" alt="" class="w-9 h-9 rounded-full ring-1 ring-brand/40" />
        <span class="block leading-none min-w-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="block" width="122.5" height="13.5" viewBox="0 0 14102 1554" role="img" aria-label="FITNESTEBAN"><path transform="translate(15 1522) scale(1 -1)" d="M-7 0H409L498 536H1161L1217 874H554L597 1138H1300L1359 1490H240Z" fill="#ffffff"/><path transform="translate(1214 1522) scale(1 -1)" d="M656 1490H240L-7 0H409Z" fill="#ffffff"/><path transform="translate(1750 1522) scale(1 -1)" d="M141 1138H565L377 0H793L981 1138H1405L1464 1490H200Z" fill="#ffffff"/><path transform="translate(3054 1522) scale(1 -1)" d="M-7 0H409L499 544C509 604 528 721 546 855C595 726 642 611 673 544L921 0H1345L1592 1490H1176L1085 944C1074 873 1055 751 1038 630C998 738 955 849 930 905L664 1490H240Z" fill="#ffffff"/><path transform="translate(4526 1522) scale(1 -1)" d="M-7 0H1147L1205 352H467L504 574H1185L1241 914H560L597 1138H1335L1393 1490H240Z" fill="#ffffff"/><linearGradient id="fsS" gradientUnits="userSpaceOnUse" x1="-8" y1="1086" x2="1453" y2="404"><stop offset=".5" stop-color="#ffffff"/><stop offset=".5" stop-color="#00d2df"/></linearGradient><path transform="translate(5774 1522) scale(1 -1)" d="M633 -24C1027 -24 1275 141 1324 440C1365 691 1236 834 903 897L786 919C636 947 586 987 598 1058C610 1133 701 1186 818 1186C946 1186 1014 1126 1007 1018H1389C1431 1330 1218 1514 844 1514C492 1514 226 1334 181 1064C142 830 282 665 560 611L704 583C866 552 925 507 913 435C900 357 803 304 672 304C521 304 438 375 452 496H59C5 169 210 -24 633 -24Z" fill="url(#fsS)"/><path transform="translate(7136 1522) scale(1 -1)" d="M141 1138H565L377 0H793L981 1138H1405L1464 1490H200Z" fill="#00d2df"/><path transform="translate(8440 1522) scale(1 -1)" d="M-7 0H1147L1205 352H467L504 574H1185L1241 914H560L597 1138H1335L1393 1490H240Z" fill="#00d2df"/><path transform="translate(9688 1522) scale(1 -1)" d="M-7 0H705C1028 0 1236 165 1274 396C1311 619 1181 768 990 783V784C1168 817 1313 932 1339 1092C1377 1322 1215 1490 875 1490H239ZM448 312 497 606H717C818 606 873 548 859 459C844 370 769 312 668 312ZM546 900 592 1178H787C879 1178 929 1123 915 1039C901 955 833 900 741 900Z" fill="#00d2df"/><path transform="translate(10978 1522) scale(1 -1)" d="M-87 0H381L495 245H993L1023 0H1478L1220 1490H660ZM644 565 650 578C734 758 813 932 891 1113C909 932 930 758 952 578L954 565Z" fill="#00d2df"/><path transform="translate(12502 1522) scale(1 -1)" d="M-7 0H409L499 544C509 604 528 721 546 855C595 726 642 611 673 544L921 0H1345L1592 1490H1176L1085 944C1074 873 1055 751 1038 630C998 738 955 849 930 905L664 1490H240Z" fill="#00d2df"/></svg>
          <span id="headerSub" class="block text-[10px] text-mute mt-1 truncate">Gym · Nutrición · Coach</span>
        </span>
      </button>
      <div class="flex items-center gap-2 shrink-0">
        <button id="helpBtn" type="button" class="help-btn" aria-label="Guía de la app">?</button>
        <button id="timerPill" type="button" class="timer-pill" aria-label="Temporizador de descanso">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
          <span id="timerDisplay" class="font-mono">Descanso</span>
        </button>
      </div>
    </div>
    <div class="h-0.5 bg-transparent"><div id="timerBar" class="h-0.5 bg-brand transition-[width] duration-200" style="width:0%"></div></div>
  </header>

  <div id="topBanner" class="max-w-xl mx-auto px-4"></div>

  <main id="app" class="max-w-xl mx-auto px-4 pt-4 pb-36"></main>

  <nav class="fixed bottom-0 inset-x-0 z-30 bg-panel/95 backdrop-blur border-t border-line pb-safe">
    <div class="max-w-xl mx-auto grid grid-cols-4">
      <button class="navbtn" data-view="train" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        <span>Entreno</span>
      </button>
      <button class="navbtn" data-view="diet" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-1.5-2-5-2.5-6.5 0-1.8 3 0 9 3 12 1.2 1.1 2.3 1 3.5.3 1.2.7 2.3.8 3.5-.3 3-3 4.8-9 3-12-1.5-2.5-5-2-6.5 0z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg>
        <span>Dieta</span>
      </button>
      <button class="navbtn" data-view="progress" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><path d="M15 7h3v3"/></svg>
        <span>Progreso</span>
      </button>
      <button class="navbtn" data-view="settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>Ajustes</span>
      </button>
    </div>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="fixed top-16 inset-x-0 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

  <input type="file" id="mealPhotoInput" accept="image/*" capture="environment" class="hidden" />
  <input type="file" id="mealGalleryInput" accept="image/*" class="hidden" />
  <input type="file" id="importInput" accept=".json,.txt,application/json,text/plain" class="hidden" />

  <script src="app.js"></script>
</body>
</html>
